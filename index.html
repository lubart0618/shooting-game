<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>射擊遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #111827;
            overflow: hidden;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        
        .target {
            position: absolute;
            cursor: pointer;
            transition: transform 0.1s;
        }
        
        .target:hover {
            transform: scale(1.05);
        }
        
        .target.hit {
            animation: fadeOut 1s forwards;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0.3; }
        }
        
        .bullet {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #fbbf24;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }
        
        .crosshair {
            position: absolute;
            width: 40px;
            height: 40px;
            pointer-events: none;
            z-index: 1000;
            transform: translate(-50%, -50%);
        }
        
        .score-popup {
            position: absolute;
            color: #10b981;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 200;
            animation: scoreFloat 1s forwards;
        }
        
        @keyframes scoreFloat {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-50px); opacity: 0; }
        }
        
        .gun {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 100px;
            z-index: 500;
            transform-origin: bottom right;
        }
    </style>
</head>
<body class="cursor-none">
    <div class="fixed top-0 left-0 w-full p-4 flex justify-between items-center z-50">
        <div class="text-white text-xl font-bold">
            分數: <span id="score">0</span>
        </div>
        <div class="flex space-x-4">
            <div class="text-white text-xl">
                剩餘時間: <span id="timer">60</span>
            </div>
            <button id="restartBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1 rounded-lg">
                重新開始
            </button>
        </div>
    </div>
    
    <div id="gameArea" class="w-full h-screen relative">
        <!-- 遊戲區域 -->
    </div>
    
    <div id="crosshair" class="crosshair">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="48" stroke="#ef4444" stroke-width="2" fill="none" />
            <line x1="50" y1="20" x2="50" y2="40" stroke="#ef4444" stroke-width="2" />
            <line x1="50" y1="60" x2="50" y2="80" stroke="#ef4444" stroke-width="2" />
            <line x1="20" y1="50" x2="40" y2="50" stroke="#ef4444" stroke-width="2" />
            <line x1="60" y1="50" x2="80" y2="50" stroke="#ef4444" stroke-width="2" />
            <circle cx="50" cy="50" r="3" fill="#ef4444" />
        </svg>
    </div>
    
    <div id="gun" class="gun">
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
            <rect x="10" y="40" width="140" height="20" rx="5" fill="#4b5563" />
            <rect x="120" y="30" width="30" height="40" rx="2" fill="#374151" />
            <rect x="150" y="35" width="40" height="30" rx="2" fill="#1f2937" />
            <rect x="10" y="60" width="30" height="30" rx="2" fill="#6b7280" />
        </svg>
    </div>
    
    <div id="gameOverModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[1000] hidden">
        <div class="bg-gray-800 rounded-lg shadow-xl max-w-md w-full mx-4 p-6 text-center border-2 border-indigo-500">
            <h2 class="text-3xl font-bold text-white mb-4">遊戲結束！</h2>
            <p class="text-xl text-gray-300 mb-2">你的分數：<span id="finalScore" class="text-indigo-400 font-bold">0</span></p>
            <p class="text-gray-400 mb-6">擊中目標：<span id="hitsCount" class="font-bold">0</span></p>
            <button id="playAgainBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-lg text-lg font-bold transition-all duration-200 hover:scale-105">
                再玩一次
            </button>
        </div>
    </div>

    <script>
        // 遊戲變數
        let score = 0;
        let timeLeft = 60;
        let gameActive = true;
        let targets = [];
        let hitCount = 0;
        let gameInterval;
        
        // DOM 元素
        const gameArea = document.getElementById('gameArea');
        const scoreElement = document.getElementById('score');
        const timerElement = document.getElementById('timer');
        const crosshair = document.getElementById('crosshair');
        const gun = document.getElementById('gun');
        const gameOverModal = document.getElementById('gameOverModal');
        const finalScoreElement = document.getElementById('finalScore');
        const hitsCountElement = document.getElementById('hitsCount');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const restartBtn = document.getElementById('restartBtn');
        
        // 目標類型
        const targetTypes = [
            {
                name: '標準目標',
                color: '#ef4444', // 紅色
                points: 10,
                size: 60,
                speed: 2
            },
            {
                name: '小目標',
                color: '#f59e0b', // 橙色
                points: 20,
                size: 40,
                speed: 3
            },
            {
                name: '快速目標',
                color: '#10b981', // 綠色
                points: 30,
                size: 50,
                speed: 4
            }
        ];
        
        // 初始化遊戲
        function initGame() {
            score = 0;
            timeLeft = 60;
            gameActive = true;
            targets = [];
            hitCount = 0;
            
            scoreElement.textContent = score;
            timerElement.textContent = timeLeft;
            
            // 清除所有目標
            gameArea.innerHTML = '';
            
            // 開始生成目標
            createTarget();
            
            // 設置定時器
            gameInterval = setInterval(() => {
                timeLeft--;
                timerElement.textContent = timeLeft;
                
                if (timeLeft <= 0) {
                    endGame();
                }
                
                // 每隔幾秒生成新目標
                if (timeLeft % 3 === 0) {
                    createTarget();
                }
            }, 1000);
        }
        
        // 創建目標
        function createTarget() {
            if (!gameActive) return;
            
            const targetType = targetTypes[Math.floor(Math.random() * targetTypes.length)];
            const size = targetType.size;
            
            // 確保目標不會生成在螢幕外
            const maxX = window.innerWidth - size;
            const maxY = window.innerHeight - size;
            
            const x = Math.random() * maxX;
            const y = Math.random() * maxY;
            
            const target = document.createElement('div');
            target.className = 'target';
            target.style.width = `${size}px`;
            target.style.height = `${size}px`;
            target.style.left = `${x}px`;
            target.style.top = `${y}px`;
            
            // 創建 SVG 目標
            target.innerHTML = `
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="45" fill="${targetType.color}" />
                    <circle cx="50" cy="50" r="35" fill="white" />
                    <circle cx="50" cy="50" r="25" fill="${targetType.color}" />
                    <circle cx="50" cy="50" r="15" fill="white" />
                    <circle cx="50" cy="50" r="5" fill="${targetType.color}" />
                </svg>
            `;
            
            // 存儲目標數據
            const targetData = {
                element: target,
                x: x,
                y: y,
                dx: 0,
                dy: 0,
                points: targetType.points,
                size: size,
                hit: false,
                speed: targetType.speed
            };
            
            targets.push(targetData);
            gameArea.appendChild(target);
            
            // 添加點擊事件
            target.addEventListener('click', () => {
                if (!targetData.hit && gameActive) {
                    hitTarget(targetData);
                }
            });
        }
        
        // 擊中目標
        function hitTarget(targetData) {
            if (targetData.hit) return;
            
            targetData.hit = true;
            targetData.element.classList.add('hit');
            
            // 增加分數
            score += targetData.points;
            scoreElement.textContent = score;
            hitCount++;
            
            // 顯示得分彈出
            const scorePopup = document.createElement('div');
            scorePopup.className = 'score-popup';
            scorePopup.textContent = `+${targetData.points}`;
            scorePopup.style.left = `${targetData.x + targetData.size / 2}px`;
            scorePopup.style.top = `${targetData.y}px`;
            gameArea.appendChild(scorePopup);
            
            // 移除得分彈出
            setTimeout(() => {
                if (scorePopup.parentNode) {
                    scorePopup.parentNode.removeChild(scorePopup);
                }
            }, 1000);
            
            // 設置隨機移動方向
            const angle = Math.random() * Math.PI * 2;
            targetData.dx = Math.cos(angle) * targetData.speed;
            targetData.dy = Math.sin(angle) * targetData.speed;
            
            // 開始移動目標
            moveTarget(targetData);
        }
        
        // 移動目標
        function moveTarget(targetData) {
            if (!gameActive) return;
            
            // 更新位置
            targetData.x += targetData.dx;
            targetData.y += targetData.dy;
            
            // 檢查邊界碰撞
            if (targetData.x <= 0 || targetData.x >= window.innerWidth - targetData.size) {
                targetData.dx = -targetData.dx;
                targetData.x = Math.max(0, Math.min(targetData.x, window.innerWidth - targetData.size));
            }
            
            if (targetData.y <= 0 || targetData.y >= window.innerHeight - targetData.size) {
                targetData.dy = -targetData.dy;
                targetData.y = Math.max(0, Math.min(targetData.y, window.innerHeight - targetData.size));
            }
            
            // 更新 DOM 元素位置
            targetData.element.style.left = `${targetData.x}px`;
            targetData.element.style.top = `${targetData.y}px`;
            
            // 繼續移動
            requestAnimationFrame(() => moveTarget(targetData));
        }
        
        // 射擊效果
        function shoot(x, y) {
            if (!gameActive) return;
            
            // 創建子彈效果
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            bullet.style.left = `${x}px`;
            bullet.style.top = `${y}px`;
            gameArea.appendChild(bullet);
            
            // 移除子彈效果
            setTimeout(() => {
                if (bullet.parentNode) {
                    bullet.parentNode.removeChild(bullet);
                }
            }, 200);
            
            // 槍的反作用力效果
            gun.style.transform = 'rotate(-5deg) translateY(5px)';
            setTimeout(() => {
                gun.style.transform = 'rotate(0) translateY(0)';
            }, 100);
        }
        
        // 結束遊戲
        function endGame() {
            gameActive = false;
            clearInterval(gameInterval);
            
            finalScoreElement.textContent = score;
            hitsCountElement.textContent = hitCount;
            gameOverModal.classList.remove('hidden');
        }
        
        // 事件監聽器
        document.addEventListener('mousemove', (e) => {
            // 更新準心位置
            crosshair.style.left = `${e.clientX}px`;
            crosshair.style.top = `${e.clientY}px`;
            
            // 更新槍的角度
            const gunRect = gun.getBoundingClientRect();
            const gunCenterX = gunRect.left + gunRect.width / 2;
            const gunCenterY = gunRect.top + gunRect.height / 2;
            
            const angle = Math.atan2(e.clientY - gunCenterY, e.clientX - gunCenterX) * 180 / Math.PI;
            gun.style.transform = `rotate(${angle}deg)`;
        });
        
        document.addEventListener('click', (e) => {
            if (gameActive) {
                shoot(e.clientX, e.clientY);
            }
        });
        
        playAgainBtn.addEventListener('click', () => {
            gameOverModal.classList.add('hidden');
            initGame();
        });
        
        restartBtn.addEventListener('click', () => {
            clearInterval(gameInterval);
            initGame();
        });
        
        // 開始遊戲
        initGame();
    </script>
</body>
</html>
